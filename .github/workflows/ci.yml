name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # n8n's own linter enforces much of the community-node verification
      # checklist. If this fails, the node is not eligible for verification.
      - run: npm run lint
      # The submission gate. `npm run lint` is a weaker, older ruleset — it
      # passed 0.1.0, which the scanner then rejected. See scripts/scan-check.mjs.
      - run: npm test
      - run: npm run build

  # Verified community nodes may not have ANY runtime dependencies. That rule
  # is why this node is declarative rather than importing @firmendata/sdk, so
  # assert it rather than trust it.
  no-runtime-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: package.json declares no dependencies
        run: |
          node -e "
            const p = require('./package.json');
            const deps = Object.keys(p.dependencies ?? {});
            if (deps.length) {
              console.error('::error::Runtime dependencies added: ' + deps.join(', ') +
                '. Verified n8n community nodes must have none.');
              process.exit(1);
            }
            console.log('No runtime dependencies. Good.');
          "

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so a secret committed and later removed is still found.
          fetch-depth: 0
      # The gitleaks CLI, not gitleaks/gitleaks-action. The scanner is MIT and
      # free; it is the Action wrapper that requires a paid licence for
      # organisation-owned repos, and it fails the job outright without one.
      # Running the binary directly is the same scan with no licence.
      - name: Scan git history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 1
